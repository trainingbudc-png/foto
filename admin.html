<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้าน (แอดมิน)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; padding: 40px 20px; margin: 0; }
        .box { background: white; max-width: 600px; margin: 0 auto 30px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2, h3 { margin-top: 0; color: #333; }
        input[type="text"], input[type="file"] { width: 90%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .search-box { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #007AFF; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        .search-box:focus { box-shadow: 0 0 8px rgba(0, 122, 255, 0.3); }
        button { padding: 12px 25px; font-size: 16px; font-weight: bold; background: #007AFF; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #005bb5; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .btn-upload { width: 100%; font-size: 18px; padding: 15px; }
        .btn-delete { background: #FF3B30; padding: 8px 15px; font-size: 14px; }
        .btn-delete:hover { background: #c92a20; }
        .btn-back { background: #555; }
        #status { margin-top: 20px; font-weight: bold; }
        .loading { color: #FF9500; }
        .success { color: #34C759; }
        .error { color: #FF3B30; }
        .list-container { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; text-align: left; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .list-info { display: flex; align-items: center; gap: 15px; }
        .list-info img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; }
        .list-name { font-weight: bold; font-size: 16px; color: #333; }
    </style>
</head>
<body>
    <div style="max-width: 600px; margin: 0 auto 20px auto; text-align: left;">
        <button class="btn-back" onclick="window.location.href='index.html'">⬅️ กลับหน้าหลัก</button>
    </div>

    <div class="box">
        <h2>📁 เพิ่มแบบฝึกหัดใหม่</h2>
        <p>รองรับไฟล์รูปภาพ และ <b>ไฟล์ PDF (รองรับหลายหน้า)</b><br>
        <span style="font-size: 12px; color: #888;">*หาก PDF มีหลายหน้า จะใช้เวลาอัปโหลดนานขึ้นตามจำนวนหน้านะครับ</span></p>
        <input type="text" id="fileName" placeholder="ตั้งชื่อแบบฝึกหัด..." required>
        <input type="file" id="fileInput" accept="image/*, application/pdf" required>
        <button id="uploadBtn" class="btn-upload">🚀 อัปโหลดเข้าสู่ระบบ</button>
        <div id="status"></div>
    </div>

    <div class="box">
        <h3>🗑️ จัดการแบบฝึกหัดที่มีอยู่</h3>
        <input type="text" id="adminSearchInput" class="search-box" placeholder="🔍 พิมพ์ชื่อแบบฝึกหัดเพื่อกรองหา...">
        <div id="adminGallery" class="list-container">
            <div class="loading" style="text-align: center;">⏳ กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, orderBy, doc, deleteDoc } 
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6X-sBEO8AqZF2i0qzJqyrwLU5FVtqQ5s",
            authDomain: "ipad-drawing-app.firebaseapp.com",
            projectId: "ipad-drawing-app",
            storageBucket: "ipad-drawing-app.firebasestorage.app",
            messagingSenderId: "1039285685408",
            appId: "1:1039285685408:web:d1ae93d102084e2c3c0dc5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = 'e0fa69420791826c629b428735db5af8';
        const adminGallery = document.getElementById('adminGallery');
        const adminSearchInput = document.getElementById('adminSearchInput');
        let allAdminItems = []; 

        async function loadAdminGallery() {
            adminGallery.innerHTML = '<div class="loading" style="text-align: center;">⏳ กำลังโหลดข้อมูล...</div>';
            try {
                const q = query(collection(db, "workbooks"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allAdminItems = []; 
                if(querySnapshot.empty) {
                    adminGallery.innerHTML = "<p style='text-align: center; color: #888;'>ยังไม่มีแบบฝึกหัดในระบบ</p>"; return;
                }
                querySnapshot.forEach((documentSnapshot) => {
                    allAdminItems.push({ id: documentSnapshot.id, ...documentSnapshot.data() });
                });
                renderAdminList(allAdminItems);
            } catch (error) {
                adminGallery.innerHTML = "<p class='error' style='text-align: center;'>❌ ไม่สามารถโหลดข้อมูลได้</p>";
            }
        }

        function renderAdminList(itemsToRender) {
            adminGallery.innerHTML = ''; 
            if (itemsToRender.length === 0) { adminGallery.innerHTML = "<p style='text-align: center; color: #888;'>ไม่พบแบบฝึกหัดที่ค้นหา</p>"; return; }

            itemsToRender.forEach((data) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'list-item';
                
                // ✨ แก้ไขให้ดึงเฉพาะ "ลิงก์แรก" มาทำเป็นหน้าปก
                const coverImage = data.url.split('|')[0]; 

                itemDiv.innerHTML = `
                    <div class="list-info">
                        <img src="${coverImage}" alt="${data.name}">
                        <span class="list-name">${data.name}</span>
                    </div>
                `;
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete';
                deleteBtn.innerHTML = "🗑️ ลบ";
                deleteBtn.onclick = async () => {
                    if (confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบแบบฝึกหัด: "${data.name}" ?`)) {
                        deleteBtn.innerHTML = "⏳ กำลังลบ...";
                        deleteBtn.disabled = true;
                        try {
                            await deleteDoc(doc(db, "workbooks", data.id));
                            loadAdminGallery(); adminSearchInput.value = ''; 
                        } catch (error) {
                            alert("❌ เกิดข้อผิดพลาดในการลบ"); deleteBtn.disabled = false;
                        }
                    }
                };
                itemDiv.appendChild(deleteBtn);
                adminGallery.appendChild(itemDiv);
            });
        }

        adminSearchInput.addEventListener('input', (e) => {
            renderAdminList(allAdminItems.filter(item => item.name.toLowerCase().includes(e.target.value.toLowerCase())));
        });
        loadAdminGallery();

        // ✨ อัปเกรดระบบอัปโหลดให้รองรับ PDF ทุกหน้า ✨
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileName = document.getElementById('fileName').value;
            const fileInput = document.getElementById('fileInput').files[0];
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (!fileName || !fileInput) { alert('กรุณากรอกชื่อและเลือกไฟล์'); return; }

            statusDiv.className = "loading";
            btn.disabled = true;
            let finalImageUrl = ""; 

            try {
                if (fileInput.type === "application/pdf") {
                    statusDiv.innerHTML = "⏳ กำลังอ่านไฟล์ PDF...";
                    const arrayBuffer = await fileInput.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    const totalPages = pdf.numPages; // เช็คว่ามีกี่หน้า
                    
                    let uploadedUrls = []; // เตรียมตะกร้าเก็บลิงก์แต่ละหน้า

                    // วนลูปอ่านและอัปโหลดทีละหน้า
                    for (let i = 1; i <= totalPages; i++) {
                        statusDiv.innerHTML = `⏳ กำลังแปลงและอัปโหลดหน้า ${i} / ${totalPages}...`;
                        
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({ scale: 2.0 }); 
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width; canvas.height = viewport.height;
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        
                        // แปลงเป็น JPG (คุณภาพ 80% เพื่อให้โหลดไว)
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
                        
                        const formData = new FormData();
                        formData.append('image', blob, `page_${i}.jpg`);
                        
                        const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                            method: 'POST', body: formData
                        });
                        const imgbbData = await imgbbRes.json();
                        
                        if (!imgbbData.success) throw new Error(`อัปโหลดหน้า ${i} ไม่สำเร็จ`);
                        
                        // เอาลิงก์ของหน้านั้นๆ ใส่ตะกร้าไว้
                        uploadedUrls.push(imgbbData.data.url);
                    }
                    
                    // นำทุกลิงก์มาต่อกันด้วยตัว | 
                    finalImageUrl = uploadedUrls.join('|'); 
                } 
                else {
                    // ถ้าเป็นไฟล์รูปภาพปกติ (ทำรอบเดียว)
                    statusDiv.innerHTML = "⏳ กำลังอัปโหลดไปยัง Server...";
                    const formData = new FormData();
                    formData.append('image', fileInput);
                    const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: 'POST', body: formData
                    });
                    const imgbbData = await imgbbRes.json();
                    if (!imgbbData.success) throw new Error("อัปโหลดรูปไม่สำเร็จ");
                    finalImageUrl = imgbbData.data.url; 
                }

                statusDiv.innerHTML = "⏳ กำลังบันทึกลงฐานข้อมูล Firebase...";
                await addDoc(collection(db, "workbooks"), {
                    name: fileName,
                    url: finalImageUrl, // เอาลิงก์ (หรือกลุ่มลิงก์) เซฟลงฐานข้อมูล
                    createdAt: serverTimestamp()
                });

                statusDiv.innerHTML = "✅ อัปโหลดสำเร็จเรียบร้อย!";
                statusDiv.className = "success";
                
                document.getElementById('fileName').value = '';
                document.getElementById('fileInput').value = '';
                adminSearchInput.value = ''; 
                loadAdminGallery(); 

            } catch (error) {
                statusDiv.innerHTML = "❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง";
                statusDiv.className = "error";
            } finally {
                btn.disabled = false;
                setTimeout(() => { statusDiv.innerHTML = ""; }, 5000);
            }
        });
    </script>
</body>
</html>
