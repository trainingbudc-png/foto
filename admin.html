<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการระบบ (Admin)</title>
    
    <!-- นำเข้าไลบรารี PDF.js เดิม -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f5f7; margin: 0; padding: 40px 20px; color: #333; }

        .container { max-width: 700px; margin: 0 auto; }

        /* ปุ่มย้อนกลับ */
        .btn-back-wrapper { text-align: center; margin-bottom: 25px; }
        .btn-back {
            display: inline-flex; align-items: center; justify-content: center;
            background: #ffffff; color: #555; border: 1px solid #e0e0e5;
            padding: 8px 16px; border-radius: 20px; text-decoration: none;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .btn-back:hover { background: #f9f9fb; transform: translateY(-1px); color: #111827; }

        /* กล่องเนื้อหา (Card) */
        .card {
            background: #ffffff; border-radius: 16px; padding: 35px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); margin-bottom: 25px;
        }

        /* ส่วนหัวของแต่ละกล่อง */
        .section-header { text-align: center; margin-bottom: 25px; }
        .section-header h2, .section-header h3 { margin: 0 0 8px 0; color: #1d1d1f; font-size: 22px; }
        .section-header p { margin: 0; color: #86868b; font-size: 14px; line-height: 1.5; }
        .warning-text { color: #ff9500; font-size: 12px; }

        /* --- ส่วนเพิ่มแบบฝึกหัด --- */
        input[type="text"] {
            width: 100%; padding: 14px 16px; border: 1px solid #e0e0e5; border-radius: 12px;
            font-size: 15px; outline: none; transition: 0.2s; background: #f9f9fb; margin-bottom: 20px;
        }
        input[type="text"]:focus { background: #ffffff; border-color: #007AFF; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1); }

        .file-upload-wrapper {
            position: relative; border: 2px dashed #d1d1d6; border-radius: 12px; padding: 40px 20px;
            text-align: center; background: #fdfdfd; cursor: pointer; transition: 0.2s; margin-bottom: 20px;
        }
        .file-upload-wrapper:hover { background: #f4f5f7; border-color: #a1a1a6; }
        .file-upload-input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-text { color: #86868b; font-size: 15px; font-weight: 500; pointer-events: none; }
        .file-upload-icon { font-size: 30px; margin-bottom: 10px; display: block; opacity: 0.5; pointer-events: none; }

        .btn-upload {
            width: 100%; background: #007AFF; color: white; border: none;
            padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
        }
        .btn-upload:hover:not(:disabled) { background: #005bb5; }
        .btn-upload:active:not(:disabled) { transform: scale(0.98); }
        .btn-upload:disabled { opacity: 0.6; cursor: not-allowed; }

        /* สถานะ */
        #status { margin-top: 15px; font-weight: 500; font-size: 14px; text-align: center; }
        .loading { color: #f59e0b; }
        .success { color: #10b981; }
        .error { color: #ef4444; }

        /* --- ส่วนจัดการแบบฝึกหัด --- */
        .search-container { position: relative; margin-bottom: 20px; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #86868b; font-size: 16px; }
        .search-input { padding-left: 45px !important; margin-bottom: 0 !important; }

        .list-container { display: flex; flex-direction: column; gap: 12px; }
        .list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px; border: 1px solid #e0e0e5; border-radius: 12px;
            background: #ffffff; transition: 0.2s;
        }
        .list-item:hover { border-color: #d1d1d6; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }

        .list-info { display: flex; align-items: center; gap: 15px; }
        .list-info img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; border: 1px solid #eee; background: #f4f5f7; }
        .list-name { font-size: 16px; font-weight: 500; color: #1d1d1f; }

        .btn-delete {
            background: #ffebeb; color: #FF3B30; border: none; padding: 8px 20px;
            border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-delete:hover:not(:disabled) { background: #ffdbdb; }
        .btn-delete:active:not(:disabled) { transform: scale(0.95); }
        .btn-delete:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ปุ่มกลับ -->
        <div class="btn-back-wrapper">
            <button class="btn-back" onclick="window.location.href='index.html'">← กลับหน้าหลัก</button>
        </div>

        <!-- กล่อง 1: เพิ่มข้อมูล -->
        <div class="card">
            <div class="section-header">
                <h2>📁 เพิ่มแบบฝึกหัดใหม่</h2>
                <p>รองรับไฟล์รูปภาพ และ <b>ไฟล์ PDF (รองรับหลายหน้า)</b><br>
                <span class="warning-text">*หาก PDF มีหลายหน้า ระบบจะใช้เวลาอัปโหลดนานขึ้นตามจำนวนหน้า</span></p>
            </div>

            <input type="text" id="fileName" placeholder="ตั้งชื่อแบบฝึกหัด..." required>
            
            <div class="file-upload-wrapper">
                <span class="file-upload-icon">📄</span>
                <span class="file-upload-text" id="fileLabelText">คลิกเพื่อเลือกไฟล์ (JPG, PNG, PDF)</span>
                <input type="file" id="fileInput" class="file-upload-input" accept="image/*, application/pdf" required>
            </div>
            
            <button id="uploadBtn" class="btn-upload">อัปโหลดเข้าสู่ระบบ</button>
            <div id="status"></div>
        </div>

        <!-- กล่อง 2: จัดการข้อมูล -->
        <div class="card">
            <div class="section-header">
                <h3>🗂️ จัดการแบบฝึกหัด</h3>
                <p>รายการแบบฝึกหัดทั้งหมด (การลบข้อมูลจะมีผลกับระบบทันที)</p>
            </div>
            
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="adminSearchInput" class="search-input" placeholder="ค้นหาชื่อแบบฝึกหัด...">
            </div>
            
            <div id="adminGallery" class="list-container">
                <div class="loading" style="text-align: center;">⏳ กำลังโหลดข้อมูล...</div>
            </div>
        </div>
    </div>

    <!-- โค้ด JavaScript เดิมของคุณครู นำมาใส่ครบ 100% -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, orderBy, doc, deleteDoc } 
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6X-sBEO8AqZF2i0qzJqyrwLU5FVtqQ5s",
            authDomain: "ipad-drawing-app.firebaseapp.com",
            projectId: "ipad-drawing-app",
            storageBucket: "ipad-drawing-app.firebasestorage.app",
            messagingSenderId: "1039285685408",
            appId: "1:1039285685408:web:d1ae93d102084e2c3c0dc5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = 'e0fa69420791826c629b428735db5af8';
        
        const adminGallery = document.getElementById('adminGallery');
        const adminSearchInput = document.getElementById('adminSearchInput');
        const fileInput = document.getElementById('fileInput');
        const fileLabelText = document.getElementById('fileLabelText');
        
        let allAdminItems = []; 

        fileInput.addEventListener('change', function(e) {
            if(e.target.files.length > 0) {
                fileLabelText.textContent = e.target.files[0].name;
                fileLabelText.style.color = '#007AFF';
            } else {
                fileLabelText.textContent = 'คลิกเพื่อเลือกไฟล์ (JPG, PNG, PDF)';
                fileLabelText.style.color = '#86868b';
            }
        });

        async function loadAdminGallery() {
            adminGallery.innerHTML = '<div class="loading" style="text-align: center;">⏳ กำลังโหลดข้อมูล...</div>';
            try {
                const q = query(collection(db, "workbooks"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                allAdminItems = []; 
                if(querySnapshot.empty) {
                    adminGallery.innerHTML = "<p style='text-align: center; color: #86868b; padding: 20px 0;'>ยังไม่มีแบบฝึกหัดในระบบ</p>"; return;
                }
                querySnapshot.forEach((documentSnapshot) => {
                    allAdminItems.push({ id: documentSnapshot.id, ...documentSnapshot.data() });
                });
                renderAdminList(allAdminItems);
            } catch (error) {
                adminGallery.innerHTML = "<p class='error' style='text-align: center;'>ไม่สามารถโหลดข้อมูลได้</p>";
            }
        }

        function renderAdminList(itemsToRender) {
            adminGallery.innerHTML = ''; 
            if (itemsToRender.length === 0) { adminGallery.innerHTML = "<p style='text-align: center; color: #86868b; padding: 20px 0;'>ไม่พบแบบฝึกหัดที่ค้นหา</p>"; return; }

            itemsToRender.forEach((data) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'list-item';
                
                const coverImage = data.url.split('|')[0]; 

                itemDiv.innerHTML = `
                    <div class="list-info">
                        <img src="${coverImage}" alt="${data.name}">
                        <span class="list-name">${data.name}</span>
                    </div>
                `;
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-delete';
                deleteBtn.innerHTML = "ลบ";
                deleteBtn.onclick = async () => {
                    if (confirm(`ต้องการลบ: "${data.name}" ใช่หรือไม่?`)) {
                        deleteBtn.innerHTML = "กำลังลบ...";
                        deleteBtn.disabled = true;
                        try {
                            await deleteDoc(doc(db, "workbooks", data.id));
                            loadAdminGallery(); adminSearchInput.value = ''; 
                        } catch (error) {
                            alert("เกิดข้อผิดพลาดในการลบ"); deleteBtn.disabled = false;
                        }
                    }
                };
                itemDiv.appendChild(deleteBtn);
                adminGallery.appendChild(itemDiv);
            });
        }

        adminSearchInput.addEventListener('input', (e) => {
            renderAdminList(allAdminItems.filter(item => item.name.toLowerCase().includes(e.target.value.toLowerCase())));
        });
        loadAdminGallery();

        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileName = document.getElementById('fileName').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (!fileName || !fileInput.files[0]) { alert('กรุณากรอกชื่อและเลือกไฟล์'); return; }

            statusDiv.className = "loading";
            btn.disabled = true;
            btn.innerHTML = "กำลังประมวลผล...";
            let finalImageUrl = ""; 

            try {
                if (fileInput.files[0].type === "application/pdf") {
                    statusDiv.innerHTML = "กำลังอ่านไฟล์ PDF...";
                    const arrayBuffer = await fileInput.files[0].arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    const totalPages = pdf.numPages; 
                    
                    let uploadedUrls = []; 

                    for (let i = 1; i <= totalPages; i++) {
                        statusDiv.innerHTML = `กำลังแปลงและอัปโหลดหน้า ${i} / ${totalPages}...`;
                        
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({ scale: 2.0 }); 
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = viewport.width; canvas.height = viewport.height;
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
                        const formData = new FormData();
                        formData.append('image', blob, `page_${i}.jpg`);
                        
                        const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                            method: 'POST', body: formData
                        });
                        const imgbbData = await imgbbRes.json();
                        
                        if (!imgbbData.success) throw new Error(`อัปโหลดหน้า ${i} ไม่สำเร็จ`);
                        uploadedUrls.push(imgbbData.data.url);
                    }
                    finalImageUrl = uploadedUrls.join('|'); 
                } 
                else {
                    statusDiv.innerHTML = "กำลังอัปโหลดรูปภาพ...";
                    const formData = new FormData();
                    formData.append('image', fileInput.files[0]);
                    const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: 'POST', body: formData
                    });
                    const imgbbData = await imgbbRes.json();
                    if (!imgbbData.success) throw new Error("อัปโหลดรูปไม่สำเร็จ");
                    finalImageUrl = imgbbData.data.url; 
                }

                statusDiv.innerHTML = "กำลังบันทึกลงฐานข้อมูล...";
                await addDoc(collection(db, "workbooks"), {
                    name: fileName,
                    url: finalImageUrl, 
                    createdAt: serverTimestamp()
                });

                statusDiv.innerHTML = "✅ อัปโหลดสำเร็จเรียบร้อย!";
                statusDiv.className = "success";
                
                document.getElementById('fileName').value = '';
                fileInput.value = '';
                fileLabelText.textContent = 'คลิกเพื่อเลือกไฟล์ (JPG, PNG, PDF)';
                fileLabelText.style.color = '#86868b';
                adminSearchInput.value = ''; 
                loadAdminGallery(); 

            } catch (error) {
                statusDiv.innerHTML = "❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง";
                statusDiv.className = "error";
            } finally {
                btn.disabled = false;
                btn.innerHTML = "อัปโหลดเข้าสู่ระบบ";
                setTimeout(() => { statusDiv.innerHTML = ""; }, 5000);
            }
        });
    </script>
</body>
</html>
