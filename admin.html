<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบอัปโหลดแบบฝึกหัด</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; padding: 50px 20px; }
        .upload-box { 
            background: white; max-width: 500px; margin: 0 auto; 
            padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        input[type="text"], input[type="file"] {
            width: 90%; padding: 12px; margin-bottom: 20px; 
            border: 2px solid #ddd; border-radius: 8px; font-size: 16px;
        }
        button { 
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            background: #007AFF; color: white; border: none; border-radius: 8px; 
            cursor: pointer; width: 100%; transition: 0.2s;
        }
        button:hover { background: #005bb5; }
        #status { margin-top: 20px; font-weight: bold; color: #333; }
        .loading { color: #FF9500 !important; }
        .success { color: #34C759 !important; }
        .error { color: #FF3B30 !important; }
    </style>
</head>
<body>

    <div class="upload-box">
        <h2>📁 เพิ่มแบบฝึกหัดใหม่</h2>
        <p>อัปโหลดรูปภาพ ระบบจะส่งเข้า Google Sheets อัตโนมัติ</p>

        <input type="text" id="fileName" placeholder="ตั้งชื่อแบบฝึกหัด..." required>
        <input type="file" id="fileInput" accept="image/*" required>
        
        <button id="uploadBtn" onclick="uploadData()">🚀 อัปโหลดเข้าสู่ระบบ</button>

        <div id="status"></div>
        
        <!-- ปุ่มกลับหน้าหลัก -->
        <br>
        <button style="background: #555; padding: 10px 20px; font-size: 14px; width: auto;" onclick="window.location.href='index.html'">⬅️ กลับหน้าเลือกแบบฝึกหัด</button>
    </div>

    <script>
        // ========================================================
        // ข้อมูลการเชื่อมต่อ API และ Google Forms (ใส่ให้ครบแล้ว!)
        const IMGBB_API_KEY = 'e0fa69420791826c629b428735db5af8';
        const GOOGLE_FORM_ID = '1FAIpQLSc3q4xlCqfqM1bZhDFbJE2JVs58Jc6qeaRH7z_Q41bjC6R4qQ'; 
        const ENTRY_NAME = '1353059354';
        const ENTRY_URL = '1637421390';
        // ========================================================

        async function uploadData() {
            const fileName = document.getElementById('fileName').value;
            const fileInput = document.getElementById('fileInput').files[0];
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (!fileName || !fileInput) {
                alert('กรุณากรอกชื่อและเลือกไฟล์รูปภาพ');
                return;
            }

            statusDiv.innerHTML = "⏳ กำลังอัปโหลดรูปภาพไปยัง Server...";
            statusDiv.className = "loading";
            btn.disabled = true;
            btn.style.background = "#ccc";

            try {
                // 1. อัปโหลดรูปขึ้น ImgBB
                const formData = new FormData();
                formData.append('image', fileInput);

                const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const imgbbData = await imgbbRes.json();
                
                if (!imgbbData.success) throw new Error("อัปโหลดรูปไม่สำเร็จ");
                const imageUrl = imgbbData.data.url; 

                // 2. ส่งข้อมูล (ชื่อ + ลิงก์รูป) เข้า Google Forms
                statusDiv.innerHTML = "⏳ กำลังบันทึกข้อมูลลงฐานข้อมูล...";
                
                const formPostUrl = `https://docs.google.com/forms/d/e/${GOOGLE_FORM_ID}/formResponse`;
                const formBody = new URLSearchParams();
                formBody.append(`entry.${ENTRY_NAME}`, fileName);
                formBody.append(`entry.${ENTRY_URL}`, imageUrl);

                await fetch(formPostUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formBody
                });

                // สำเร็จ!
                statusDiv.innerHTML = "✅ อัปโหลดสำเร็จเรียบร้อย! สามารถกลับไปดูที่หน้าหลักได้เลย";
                statusDiv.className = "success";
                
                // เคลียร์ช่องกรอกข้อมูล
                document.getElementById('fileName').value = '';
                document.getElementById('fileInput').value = '';

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง";
                statusDiv.className = "error";
            } finally {
                btn.disabled = false;
                btn.style.background = "#007AFF";
            }
        }
    </script>
</body>
</html>
