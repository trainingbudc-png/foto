<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบหลังบ้าน (แอดมิน)</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; padding: 40px 20px; margin: 0; }
        
        .box { 
            background: white; max-width: 600px; margin: 0 auto 30px auto; 
            padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        h2, h3 { margin-top: 0; color: #333; }
        
        input[type="text"], input[type="file"] {
            width: 90%; padding: 12px; margin-bottom: 20px; 
            border: 2px solid #ddd; border-radius: 8px; font-size: 16px;
        }
        
        button { 
            padding: 12px 25px; font-size: 16px; font-weight: bold;
            background: #007AFF; color: white; border: none; border-radius: 8px; 
            cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #005bb5; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        .btn-upload { width: 100%; font-size: 18px; padding: 15px; }
        .btn-delete { background: #FF3B30; padding: 8px 15px; font-size: 14px; }
        .btn-delete:hover { background: #c92a20; }
        .btn-back { background: #555; }
        
        #status { margin-top: 20px; font-weight: bold; }
        .loading { color: #FF9500; }
        .success { color: #34C759; }
        .error { color: #FF3B30; }

        /* สไตล์รายการแบบฝึกหัด */
        .list-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; text-align: left; }
        .list-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd;
        }
        .list-info { display: flex; align-items: center; gap: 15px; }
        .list-info img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; }
        .list-name { font-weight: bold; font-size: 16px; color: #333; }
    </style>
</head>
<body>

    <!-- ปุ่มกลับหน้าแรก -->
    <div style="max-width: 600px; margin: 0 auto 20px auto; text-align: left;">
        <button class="btn-back" onclick="window.location.href='index.html'">⬅️ กลับหน้าหลัก</button>
    </div>

    <!-- ส่วนที่ 1: อัปโหลด -->
    <div class="box">
        <h2>📁 เพิ่มแบบฝึกหัดใหม่</h2>
        <p>อัปโหลดรูปลงระบบ ฐานข้อมูลจะอัปเดตทันที</p>

        <input type="text" id="fileName" placeholder="ตั้งชื่อแบบฝึกหัด..." required>
        <input type="file" id="fileInput" accept="image/*" required>
        
        <button id="uploadBtn" class="btn-upload">🚀 อัปโหลดเข้าสู่ระบบ</button>
        <div id="status"></div>
    </div>

    <!-- ส่วนที่ 2: จัดการข้อมูล (ลบ) -->
    <div class="box">
        <h3>🗑️ จัดการแบบฝึกหัดที่มีอยู่</h3>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">รายการทั้งหมดในระบบ (ลบแล้วข้อมูลจะหายไปจากหน้าแรกทันที)</p>
        
        <div id="adminGallery" class="list-container">
            <div class="loading" style="text-align: center;">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 🔥 โค้ด Firebase ระบบหลังบ้าน -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        
        // เพิ่มคำสั่ง doc และ deleteDoc สำหรับระบบลบ
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, query, orderBy, doc, deleteDoc } 
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6X-sBEO8AqZF2i0qzJqyrwLU5FVtqQ5s",
            authDomain: "ipad-drawing-app.firebaseapp.com",
            projectId: "ipad-drawing-app",
            storageBucket: "ipad-drawing-app.firebasestorage.app",
            messagingSenderId: "1039285685408",
            appId: "1:1039285685408:web:d1ae93d102084e2c3c0dc5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const IMGBB_API_KEY = 'e0fa69420791826c629b428735db5af8';

        // ==========================================
        // 1. ระบบดึงข้อมูลมาแสดงเพื่อลบ
        // ==========================================
        const adminGallery = document.getElementById('adminGallery');

        async function loadAdminGallery() {
            adminGallery.innerHTML = '<div class="loading" style="text-align: center;">⏳ กำลังโหลดข้อมูล...</div>';
            try {
                const q = query(collection(db, "workbooks"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                adminGallery.innerHTML = ''; // ล้างข้อความโหลด
                
                if(querySnapshot.empty) {
                    adminGallery.innerHTML = "<p style='text-align: center;'>ยังไม่มีแบบฝึกหัดในระบบ</p>";
                    return;
                }

                querySnapshot.forEach((documentSnapshot) => {
                    const data = documentSnapshot.data();
                    const docId = documentSnapshot.id; // รหัสอ้างอิงสำหรับใช้ลบ

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'list-item';
                    
                    itemDiv.innerHTML = `
                        <div class="list-info">
                            <img src="${data.url}" alt="${data.name}">
                            <span class="list-name">${data.name}</span>
                        </div>
                    `;

                    // ปุ่มลบ
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.innerHTML = "🗑️ ลบ";
                    
                    // ✨ ระบบแจ้งเตือนยืนยันก่อนลบ ✨
                    deleteBtn.onclick = async () => {
                        const confirmDelete = confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบแบบฝึกหัด: "${data.name}" ?\n\n(หากลบแล้วจะไม่สามารถกู้คืนได้)`);
                        
                        if (confirmDelete) {
                            deleteBtn.innerHTML = "⏳ กำลังลบ...";
                            deleteBtn.disabled = true;
                            try {
                                // สั่งลบข้อมูลจากฐานข้อมูล Firestore
                                await deleteDoc(doc(db, "workbooks", docId));
                                // ลบเสร็จให้รีเฟรชรายการใหม่ทันที
                                loadAdminGallery(); 
                            } catch (error) {
                                console.error(error);
                                alert("❌ เกิดข้อผิดพลาดในการลบ กรุณาลองใหม่");
                                deleteBtn.innerHTML = "🗑️ ลบ";
                                deleteBtn.disabled = false;
                            }
                        }
                    };

                    itemDiv.appendChild(deleteBtn);
                    adminGallery.appendChild(itemDiv);
                });

            } catch (error) {
                console.error(error);
                adminGallery.innerHTML = "<p class='error' style='text-align: center;'>❌ ไม่สามารถโหลดข้อมูลได้</p>";
            }
        }

        // โหลดรายการทันทีเมื่อเปิดหน้าเว็บ
        loadAdminGallery();


        // ==========================================
        // 2. ระบบอัปโหลด (ของเดิม)
        // ==========================================
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileName = document.getElementById('fileName').value;
            const fileInput = document.getElementById('fileInput').files[0];
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (!fileName || !fileInput) {
                alert('กรุณากรอกชื่อและเลือกไฟล์รูปภาพ');
                return;
            }

            statusDiv.innerHTML = "⏳ กำลังอัปโหลดรูปภาพไปยัง Server...";
            statusDiv.className = "loading";
            btn.disabled = true;

            try {
                // อัปโหลดขึ้น ImgBB
                const formData = new FormData();
                formData.append('image', fileInput);
                const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const imgbbData = await imgbbRes.json();
                
                if (!imgbbData.success) throw new Error("อัปโหลดรูปไม่สำเร็จ");
                const imageUrl = imgbbData.data.url; 

                // บันทึกลง Firebase
                statusDiv.innerHTML = "⏳ กำลังบันทึกลงฐานข้อมูล Firebase...";
                await addDoc(collection(db, "workbooks"), {
                    name: fileName,
                    url: imageUrl,
                    createdAt: serverTimestamp()
                });

                statusDiv.innerHTML = "✅ อัปโหลดสำเร็จเรียบร้อย!";
                statusDiv.className = "success";
                
                // ล้างค่าช่องกรอก
                document.getElementById('fileName').value = '';
                document.getElementById('fileInput').value = '';

                // โหลดรายการใหม่ทันที เพื่อให้รูปที่เพิ่งอัปโหลดโผล่ขึ้นมาด้านล่างด้วย
                loadAdminGallery();

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง";
                statusDiv.className = "error";
            } finally {
                btn.disabled = false;
                setTimeout(() => { statusDiv.innerHTML = ""; }, 5000); // ซ่อนข้อความแจ้งเตือนหลัง 5 วินาที
            }
        });
    </script>
</body>
</html>
