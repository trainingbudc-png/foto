<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการแบบฝึกหัด (Admin)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body { 
            background-color: #f4f5f7; 
            margin: 0; 
            padding: 40px 20px; 
            color: #333;
        }

        /* ปุ่มย้อนกลับ */
        .btn-back {
            display: inline-flex;
            align-items: center;
            background: #ffffff;
            color: #333;
            border: 1px solid #e0e0e0;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-back:hover {
            background: #f0f1f4;
            transform: translateY(-1px);
        }

        /* กล่องเนื้อหาหลัก */
        .admin-container {
            background: #ffffff;
            max-width: 700px;
            margin: 0 auto;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        /* ส่วนหัว */
        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .header-section h2 {
            margin: 0 0 8px 0;
            color: #1d1d1f;
            font-size: 24px;
        }
        .header-section p {
            margin: 0;
            color: #86868b;
            font-size: 14px;
        }

        /* ช่องค้นหา */
        .search-container {
            position: relative;
            margin-bottom: 30px;
        }
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #86868b;
            font-size: 16px;
        }
        .search-input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1px solid #e0e0e5;
            border-radius: 12px;
            font-size: 15px;
            background: #f9f9fb;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            background: #ffffff;
            border-color: #007AFF;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        /* รายการแบบฝึกหัด */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border: 1px solid #e0e0e5;
            border-radius: 12px;
            background: #ffffff;
            transition: all 0.2s;
        }
        .list-item:hover {
            border-color: #d1d1d6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        /* ข้อมูลด้านซ้าย (รูป + ชื่อ) */
        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .item-thumb {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #eee;
            background: #f4f5f7;
        }
        .item-name {
            font-size: 16px;
            font-weight: 500;
            color: #1d1d1f;
        }

        /* ปุ่มลบ */
        .btn-delete {
            background: #ffebeb;
            color: #FF3B30;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-delete:hover {
            background: #ffdbdb;
            transform: scale(1.02);
        }
        .btn-delete:active {
            transform: scale(0.95);
        }

        /* ข้อความเมื่อไม่พบข้อมูล */
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #86868b;
            font-size: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div style="max-width: 700px; margin: 0 auto;">
        <button class="btn-back" onclick="window.location.href='index.html'">‹ กลับหน้าแรก</button>
    </div>

    <div class="admin-container">
        <!-- ส่วนหัวที่ปรับคำใหม่ -->
        <div class="header-section">
            <h2>จัดการแบบฝึกหัด</h2>
            <p>รายการแบบฝึกหัดทั้งหมด (โปรดระมัดระวัง การลบข้อมูลจะมีผลทันที)</p>
        </div>

        <!-- ช่องค้นหา -->
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาชื่อแบบฝึกหัด..." onkeyup="filterItems()">
        </div>

        <!-- รายการ (Container) -->
        <div class="list-container" id="workbookList">
            <!-- ตัวอย่างข้อมูล (เดี๋ยวเราใช้ JS ดึงจาก Firebase มาแทนที่ตรงนี้) -->
            <div class="list-item">
                <div class="item-info">
                    <img src="https://via.placeholder.com/45" alt="thumb" class="item-thumb">
                    <span class="item-name">แบบฝึกหัดที่ 2</span>
                </div>
                <button class="btn-delete" onclick="deleteItem('id_2')">ลบ</button>
            </div>

            <div class="list-item">
                <div class="item-info">
                    <img src="https://via.placeholder.com/45" alt="thumb" class="item-thumb">
                    <span class="item-name">แบบฝึกหัดที่ 1</span>
                </div>
                <button class="btn-delete" onclick="deleteItem('id_1')">ลบ</button>
            </div>
        </div>

        <div id="emptyState" class="empty-state">ไม่พบแบบฝึกหัดที่ค้นหา 🥲</div>
    </div>

    <!-- Script สำหรับการค้นหาและลบ (สามารถนำไปเชื่อมต่อ Firebase ได้เลย) -->
    <script>
        // ฟังก์ชันค้นหาข้อมูลแบบ Real-time
        function filterItems() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('.list-item');
            let hasVisibleItem = false;

            items.forEach(item => {
                const name = item.querySelector('.item-name').innerText.toLowerCase();
                if (name.includes(input)) {
                    item.style.display = 'flex';
                    hasVisibleItem = true;
                } else {
                    item.style.display = 'none';
                }
            });

            // แสดงข้อความถ้าหาไม่เจอ
            document.getElementById('emptyState').style.display = hasVisibleItem ? 'none' : 'block';
        }

        // ฟังก์ชันลบข้อมูล (เชื่อมกับ Firebase ต่อได้เลย)
        function deleteItem(docId) {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบแบบฝึกหัดนี้?\n(ข้อมูลจะไม่สามารถกู้คืนได้)')) {
                // ใส่โค้ด Firebase ลบข้อมูลที่นี่ เช่น:
                // await deleteDoc(doc(db, "workbooks", docId));
                
                alert('ลบข้อมูลเรียบร้อยแล้ว (จำลอง)');
                // หลังจากลบเสร็จ ให้ดึงข้อมูลมาแสดงใหม่ หรือซ่อน item นั้นไปก่อน
                // ...
            }
        }
    </script>

</body>
</html>
