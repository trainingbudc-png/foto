<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พื้นที่ทำแบบฝึกหัด (Pro Mode)</title>
    <style>
        * {
            -webkit-touch-callout: none; 
            -webkit-user-select: none;   
            user-select: none;           
        }
        input {
            -webkit-user-select: auto;
            user-select: auto;
        }

        body { font-family: sans-serif; background-color: #e9ecef; text-align: center; margin: 0; padding: 15px; transition: background-color 0.3s; }
        
        .header-tools { 
            position: sticky; top: 0; z-index: 100;
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;
            transition: all 0.3s;
        }
        .top-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .bottom-row { 
            display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; 
            background: #f8f9fa; padding: 12px; border-radius: 8px; transition: background 0.3s;
        }
        
        button { padding: 10px 15px; font-size: 14px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; transition: 0.2s;}
        button:active { transform: scale(0.95); }
        
        .btn-back { background: #555; color: white; }
        .btn-save { background: #34C759; color: white; }
        
        #btnTheme { background: #333; color: white; }
        .btn-undo { background: #FF9500; color: white; font-size: 16px; padding: 10px 15px; } 
        .btn-redo { background: #8E8E93; color: white; font-size: 16px; padding: 10px 15px; } 
        
        .tool-btn { background: #e0e0e0; color: #333; border: 2px solid transparent; transition: all 0.2s; }
        .tool-btn.active { border: 2px solid #007AFF; background: #d1e7dd; }
        
        .divider { border-left: 2px solid #ccc; height: 30px; margin: 0 5px; transition: border-color 0.3s; }
        
        input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 5px; cursor: pointer; padding: 0; background: none;}
        .slider-group { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: bold; color: #555; transition: color 0.3s; }
        input[type="range"] { cursor: pointer; width: 100px; }

        #workspace { width: 100%; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }
        
        .canvas-wrapper { position: relative; background: white; box-shadow: 0 5px 20px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; }
        .bg-img { width: 100%; display: block; user-select: none; pointer-events: none; }
        
        /* กระดานหลักและกระดานกระจกใส */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: auto; }
        .main-canvas { cursor: crosshair; }
        .draft-canvas { pointer-events: none; } /* แผ่นกระจกให้ทะลุการสัมผัสไปกระดานหลัก */

        body.dark-theme { background-color: #121212; }
        body.dark-theme .header-tools { background: #2c2c2c; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        body.dark-theme .bottom-row { background: #3a3a3a; }
        body.dark-theme .slider-group { color: #eee; }
        body.dark-theme .divider { border-left-color: #555; }
        body.dark-theme .tool-btn { background: #555; color: white; }
        body.dark-theme .tool-btn.active { background: #005bb5; border-color: #4da3ff; }
        body.dark-theme .canvas-wrapper { box-shadow: 0 5px 20px rgba(0,0,0,0.8); } 
    </style>
</head>
<body>

    <div class="header-tools">
        <div class="top-row">
            <button class="btn-back" onclick="window.location.href='index.html'">⬅️ กลับ</button>
            <button class="btn-undo" onclick="undo()">↩️ ย้อนกลับ</button>
            <button class="btn-redo" onclick="redo()">ทำซ้ำ ↪️</button>
            <button id="btnTheme" onclick="toggleTheme()">🌙 กลางคืน</button>
            <button class="btn-save" onclick="downloadAll()">💾 เซฟรูป</button>
        </div>
        
        <div class="bottom-row" id="drawingTools">
            <button class="tool-btn active" id="btnPen" onclick="setTool('pen', this)">🖊️ ปากกา</button>
            <button class="tool-btn" id="btnHighlighter" onclick="setTool('highlighter', this)">🖍️ ไฮไลท์</button>
            <button class="tool-btn" id="btnEraser" onclick="setTool('eraser', this)">🧽 ยางลบ</button>
            
            <span class="divider"></span>
            
            <label style="font-size: 14px; font-weight: bold; color: inherit;" class="slider-group">สี:</label>
            <input type="color" id="colorPicker" value="#000000" onchange="currentColor = this.value; setTool(currentTool === 'eraser' ? 'pen' : currentTool, currentTool === 'eraser' ? document.getElementById('btnPen') : null)">
            
            <span class="divider"></span>
            
            <div class="slider-group">
                <label>ขนาด:</label>
                <input type="range" id="sizeSlider" min="1" max="50" value="5" oninput="currentSize = parseInt(this.value)">
            </div>
            <div class="slider-group">
                <label>ความเข้ม:</label>
                <input type="range" id="opacitySlider" min="0.1" max="1" step="0.1" value="1" oninput="currentOpacity = parseFloat(this.value)">
            </div>
        </div>
    </div>

    <div id="workspace"></div>

    <script>
        const workspace = document.getElementById('workspace');
        const drawingTools = document.getElementById('drawingTools');
        
        let isDarkMode = false;
        let currentTool = 'pen'; 
        let currentColor = '#000000';
        let currentSize = 5;
        let currentOpacity = 1.0;
        let backgroundImages = []; 

        let globalUndoStack = []; 
        let globalRedoStack = []; 

        function undo() {
            if (globalUndoStack.length === 0) return;
            const lastState = globalUndoStack.pop();
            const targetCanvas = document.getElementById(`canvas-page-${lastState.index}`);
            
            if (targetCanvas) {
                const ctx = targetCanvas.getContext('2d');
                globalRedoStack.push({
                    index: lastState.index,
                    imageData: ctx.getImageData(0, 0, targetCanvas.width, targetCanvas.height)
                });
                ctx.putImageData(lastState.imageData, 0, 0);
            }
        }

        function redo() {
            if (globalRedoStack.length === 0) return;
            const nextState = globalRedoStack.pop();
            const targetCanvas = document.getElementById(`canvas-page-${nextState.index}`);
            
            if (targetCanvas) {
                const ctx = targetCanvas.getContext('2d');
                globalUndoStack.push({
                    index: nextState.index,
                    imageData: ctx.getImageData(0, 0, targetCanvas.width, targetCanvas.height)
                });
                ctx.putImageData(nextState.imageData, 0, 0);
            }
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-theme', isDarkMode);
            const btn = document.getElementById('btnTheme');
            if (isDarkMode) {
                btn.innerHTML = '☀️ กลางวัน';
                btn.style.background = '#f39c12';
            } else {
                btn.innerHTML = '🌙 กลางคืน';
                btn.style.background = '#333';
            }
        }

        function setTool(tool, btnElement) {
            currentTool = tool;
            const btns = drawingTools.querySelectorAll('.tool-btn');
            btns.forEach(b => b.classList.remove('active'));
            if(btnElement) {
                btnElement.classList.add('active');
            } else {
                document.getElementById(tool === 'highlighter' ? 'btnHighlighter' : 'btnPen').classList.add('active');
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const imageUrlFromUrl = urlParams.get('img');

        if (imageUrlFromUrl) {
            const pages = imageUrlFromUrl.split('|').map(url => url.trim());
            pages.forEach((url, index) => {
                createCanvasPage(url, index);
            });
        } else {
            alert("ไม่พบข้อมูลรูปภาพ");
            window.location.href = 'index.html';
        }

        function createCanvasPage(url, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'canvas-wrapper';
            
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.className = "bg-img";
            img.src = url;
            
            // 1. กระดานหลัก (บันทึกเส้นจริง)
            const canvas = document.createElement('canvas');
            canvas.id = `canvas-page-${index}`;
            canvas.className = "main-canvas";
            
            // 2. กระดานกระจกใส (ใช้วาดชั่วคราวเพื่อแก้ปัญหาสีทับกันไม่เนียน)
            const draftCanvas = document.createElement('canvas');
            draftCanvas.id = `draft-canvas-${index}`;
            draftCanvas.className = "draft-canvas";
            
            img.onload = () => {
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                draftCanvas.width = img.naturalWidth;
                draftCanvas.height = img.naturalHeight;
                backgroundImages[index] = img; 
            };

            wrapper.appendChild(img);
            wrapper.appendChild(canvas);
            wrapper.appendChild(draftCanvas); // ซ้อนเข้าไปอีกชั้น
            workspace.appendChild(wrapper);

            setupDrawingSystem(canvas, draftCanvas, index);
        }

        function setupDrawingSystem(canvas, draftCanvas, pageIndex) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true }); 
            const draftCtx = draftCanvas.getContext('2d', { willReadFrequently: true }); 
            let isDrawing = false;
            let lastX = 0, lastY = 0;

            function getPos(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            function startAction(x, y) {
                // เซฟประวัติ Undo
                globalUndoStack.push({
                    index: pageIndex,
                    imageData: ctx.getImageData(0, 0, canvas.width, canvas.height)
                });
                if (globalUndoStack.length > 50) globalUndoStack.shift();
                globalRedoStack = [];

                isDrawing = true;
                lastX = x; lastY = y;
                
                // ตั้งค่าความโปร่งแสงของกระจกใสล่วงหน้า
                if (currentTool === 'highlighter') {
                    draftCanvas.style.opacity = currentOpacity * 0.3; // ไฮไลท์จางๆ
                } else if (currentTool === 'pen') {
                    draftCanvas.style.opacity = currentOpacity;
                }
            }

            function drawAction(x, y, pressure) {
                if (!isDrawing) return;
                
                if (currentTool === 'eraser') {
                    // ยางลบให้ลบกระดานจริงทันที
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.globalAlpha = 1.0; 
                    ctx.lineWidth = currentSize * 5; 
                    ctx.strokeStyle = "rgba(0,0,0,1)";
                    
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                } else {
                    // ปากกาและไฮไลท์ วาดลงกระจกใสแบบทึบ 100% เสมอ (ป้องกันจุดทับกันแล้วเข้มขึ้น)
                    draftCtx.lineCap = 'round';
                    draftCtx.lineJoin = 'round';
                    draftCtx.globalCompositeOperation = 'source-over';
                    draftCtx.globalAlpha = 1.0; 
                    
                    if (currentTool === 'highlighter') {
                        draftCtx.lineWidth = currentSize * 4;
                        draftCtx.strokeStyle = currentColor;
                    } else {
                        draftCtx.lineWidth = (pressure * currentSize * 2) + 1; 
                        draftCtx.strokeStyle = currentColor;
                    }

                    draftCtx.beginPath();
                    draftCtx.moveTo(lastX, lastY);
                    draftCtx.lineTo(x, y);
                    draftCtx.stroke();
                }

                lastX = x; lastY = y;
            }

            function stopAction() {
                if (isDrawing) {
                    if (currentTool !== 'eraser') {
                        // ปั๊มจากกระจกใส ลงสู่กระดานหลัก
                        ctx.globalCompositeOperation = 'source-over';
                        if (currentTool === 'highlighter') {
                            ctx.globalAlpha = currentOpacity * 0.3;
                        } else {
                            ctx.globalAlpha = currentOpacity;
                        }
                        ctx.drawImage(draftCanvas, 0, 0);
                        
                        // ล้างกระจกใสทิ้ง เตรียมพร้อมวาดเส้นต่อไป
                        draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
                    }
                    isDrawing = false;
                }
            }

            // ==========================================
            // เมาส์
            // ==========================================
            canvas.addEventListener('mousedown', (e) => {
                const pos = getPos(e.clientX, e.clientY);
                startAction(pos.x, pos.y);
            });
            canvas.addEventListener('mousemove', (e) => {
                const pos = getPos(e.clientX, e.clientY);
                drawAction(pos.x, pos.y, 0.5);
            });
            canvas.addEventListener('mouseup', stopAction);
            canvas.addEventListener('mouseleave', stopAction);

            // ==========================================
            // Apple Pencil
            // ==========================================
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches[0].touchType === 'stylus') {
                    e.preventDefault(); 
                    const pos = getPos(e.touches[0].clientX, e.touches[0].clientY);
                    startAction(pos.x, pos.y);
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches[0].touchType === 'stylus') {
                    e.preventDefault(); 
                    const pos = getPos(e.touches[0].clientX, e.touches[0].clientY);
                    let pressure = e.touches[0].force !== undefined ? e.touches[0].force : 0.5;
                    if (pressure === 0) pressure = 0.5; 
                    drawAction(pos.x, pos.y, pressure);
                }
            }, { passive: false });

            canvas.addEventListener('touchend', stopAction);
            canvas.addEventListener('touchcancel', stopAction);
        }

        // ==========================================
        // ระบบเซฟรูป
        // ==========================================
        function downloadAll() {
            // โหลดเฉพาะกระดานหลัก (ไม่เอากระจกใส)
            const canvases = document.querySelectorAll('.main-canvas');
            if (canvases.length === 0) return;

            canvases.forEach((drawCanvas, index) => {
                setTimeout(() => {
                    const exportCanvas = document.createElement('canvas');
                    exportCanvas.width = drawCanvas.width;
                    exportCanvas.height = drawCanvas.height;
                    const ctx = exportCanvas.getContext('2d');

                    if (backgroundImages[index]) {
                        ctx.drawImage(backgroundImages[index], 0, 0);
                    }
                    
                    ctx.drawImage(drawCanvas, 0, 0);

                    const link = document.createElement('a');
                    link.download = `แบบฝึกหัด-แก้ไขแล้ว-${index + 1}.png`;
                    link.href = exportCanvas.toDataURL('image/png');
                    link.click();
                }, index * 400); 
            });
        }
    </script>
</body>
</html>
