<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พื้นที่ทำแบบฝึกหัด (Pro Mode)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            -webkit-touch-callout: none; 
            -webkit-user-select: none;   
            user-select: none;           
        }
        input {
            -webkit-user-select: auto;
            user-select: auto;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f5f7; text-align: center; margin: 0; padding: 0 0 20px 0; transition: background-color 0.3s; }
        
        .header-tools { 
            position: sticky; top: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        
        .top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; margin: 0 auto; position: relative; }
        .top-group { display: flex; gap: 8px; align-items: center; }
        
        /* ✨ ดีไซน์ใหม่ของตัวเปลี่ยนหน้า (อยู่ตรงกลางแบบโปรๆ) ✨ */
        .pagination-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: #f0f1f4;
            border-radius: 20px;
            padding: 4px;
            gap: 5px;
        }
        .btn-page {
            background: white; border: none; width: 32px; height: 32px;
            border-radius: 50%; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #555; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }
        .btn-page:hover:not(:disabled) { background: #e2e4e9; color: #000; transform: scale(1.05); }
        .btn-page:active:not(:disabled) { transform: scale(0.9); }
        .btn-page:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        #pageIndicator { font-size: 13px; font-weight: bold; color: #333; min-width: 70px; text-align: center; }

        .bottom-row { 
            display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; 
            max-width: 900px; margin: 0 auto;
        }

        .btn-clean {
            background: #f0f1f4; color: #333; border: none; padding: 8px 14px;
            border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;
        }
        .btn-clean:hover { background: #e2e4e9; }
        .btn-clean:active { transform: scale(0.95); }
        
        .btn-danger { color: #FF3B30; background: #ffebeb; }
        .btn-danger:hover { background: #ffd6d6; }

        .btn-primary {
            background: #007AFF; color: white; border: none; padding: 8px 18px;
            border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
        }
        .btn-primary:hover { background: #005bb5; }
        .btn-primary:active { transform: scale(0.95); }

        .separator { width: 1px; height: 24px; background: #d1d1d6; margin: 0 5px; }

        /* ✨ เปลี่ยนปุ่มเครื่องมือให้เป็นกล่องสี่เหลี่ยมจัตุรัส ✨ */
        .tool-btn { 
            background: #f0f1f4; 
            color: #555;
            border: 2px solid transparent; 
            width: 42px; 
            height: 42px; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.2s;
            display: flex; 
            justify-content: center; 
            align-items: center;
            font-size: 20px; 
            padding: 0;
        }
        .tool-btn.active { 
            border: 2px solid #007AFF; 
            background: #e5f1ff; 
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.2); 
            color: #007AFF;
        }
        
        input[type="color"] { width: 35px; height: 35px; border: none; border-radius: 5px; cursor: pointer; padding: 0; background: none;}
        .slider-group { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; color: #555; transition: color 0.3s; }
        input[type="range"] { cursor: pointer; width: 90px; }

        #workspace { width: 100%; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; padding: 0 15px;}
        
        .canvas-wrapper { position: relative; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        .bg-img { width: 100%; display: block; user-select: none; pointer-events: none; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: auto; }
        .main-canvas { cursor: crosshair; }
        .draft-canvas { pointer-events: none; } 

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 16px; width: 90%; max-width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center;
        }
        .modal-content h3 { margin-top: 0; margin-bottom: 20px; color: #333; font-size: 18px; }
        .btn-export { display: block; width: 100%; padding: 14px; margin-bottom: 10px; font-size: 15px; font-weight: bold; border-radius: 10px; color: white; border: none; cursor: pointer; transition: 0.2s;}
        .btn-export:active { transform: scale(0.98); }
        .btn-export.pdf { background: #FF3B30; }
        .btn-export.png { background: #007AFF; }
        .btn-export.jpg { background: #34C759; }
        .btn-export.cancel { background: #f0f1f4; color: #333; margin-top: 15px; }

        body.dark-theme { background-color: #121212; }
        body.dark-theme .header-tools { background: rgba(30, 30, 30, 0.9); border-bottom: 1px solid #333; }
        body.dark-theme .btn-clean { background: #2c2c2e; color: #eee; }
        body.dark-theme .btn-clean:hover { background: #3a3a3c; }
        body.dark-theme .btn-danger { color: #ff6b63; background: #3a1c1c; }
        body.dark-theme .tool-btn { background: #2c2c2e; color: #aaa; }
        body.dark-theme .tool-btn.active { background: #1c3552; border-color: #0a84ff; color: #0a84ff;}
        body.dark-theme .slider-group { color: #ccc; }
        body.dark-theme .separator { background: #444; }
        body.dark-theme .canvas-wrapper { box-shadow: 0 5px 25px rgba(0,0,0,0.8); } 
        body.dark-theme .modal-content { background: #2c2c2e; }
        body.dark-theme .modal-content h3 { color: white; }
        body.dark-theme .btn-export.cancel { background: #444; color: white;}
        /* Dark Theme สำหรับตัวเปลี่ยนหน้า */
        body.dark-theme .pagination-center { background: #2c2c2e; }
        body.dark-theme .btn-page { background: #3a3a3c; color: #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        body.dark-theme .btn-page:hover:not(:disabled) { background: #4a4a4c; color: #fff; }
        body.dark-theme #pageIndicator { color: #eee; }
    </style>
</head>
<body>

    <div class="header-tools">
        <div class="top-row">
            <!-- กลุ่มปุ่มซ้าย -->
            <div class="top-group">
                <button class="btn-clean" onclick="goBack()">‹ กลับ</button>
                <div class="separator"></div>
                <button class="btn-clean" onclick="undo()" title="ย้อนกลับ">↩</button>
                <button class="btn-clean" onclick="redo()" title="ทำซ้ำ">↪</button>
            </div>

            <!-- ตัวเปลี่ยนหน้าอยู่ตรงกลาง (ดีไซน์ Pill แบบโปรๆ) -->
            <div class="pagination-center" id="paginationBar" style="display: none;">
                <button class="btn-page" id="btnPrevPage" onclick="prevPage()">◀</button>
                <span id="pageIndicator">1 / 1</span>
                <button class="btn-page" id="btnNextPage" onclick="nextPage()">▶</button>
            </div>

            <!-- กลุ่มปุ่มขวา -->
            <div class="top-group">
                <button class="btn-clean" id="btnTheme" onclick="toggleTheme()" title="สลับโหมดสี">🌙</button>
                <button class="btn-clean btn-danger" onclick="clearDraft()">ล้าง</button>
                <button class="btn-primary" onclick="openExportModal()">ส่งออก</button>
            </div>
        </div>
        
        <!-- แถบเครื่องมือวาดรูป (ไอคอนเท่านั้น) -->
        <div class="bottom-row" id="drawingTools">
            <button class="tool-btn active" id="btnPen" onclick="setTool('pen', this)" title="ปากกา">🖊️</button>
            <button class="tool-btn" id="btnHighlighter" onclick="setTool('highlighter', this)" title="ไฮไลท์">🖍️</button>
            <button class="tool-btn" id="btnEraser" onclick="setTool('eraser', this)" title="ยางลบ">🧽</button>
            
            <div class="separator"></div>
            
            <label class="slider-group">สี: <input type="color" id="colorPicker" value="#000000" onchange="currentColor = this.value; setTool(currentTool === 'eraser' ? 'pen' : currentTool, currentTool === 'eraser' ? document.getElementById('btnPen') : null)"></label>
            
            <div class="separator"></div>
            
            <div class="slider-group">ขนาด: <input type="range" id="sizeSlider" min="1" max="50" value="5" oninput="currentSize = parseInt(this.value)"></div>
            <div class="slider-group">เข้ม: <input type="range" id="opacitySlider" min="0.1" max="1" step="0.1" value="1" oninput="currentOpacity = parseFloat(this.value)"></div>
        </div>
    </div>

    <div id="workspace"></div>

    <div id="exportModal" class="modal-overlay">
        <div class="modal-content">
            <h3>💾 เลือกรูปแบบไฟล์</h3>
            <button class="btn-export pdf" onclick="executeDownload('pdf')">📄 PDF (รวมทุกหน้า)</button>
            <button class="btn-export png" onclick="executeDownload('png')">🖼️ PNG (เฉพาะหน้านี้)</button>
            <button class="btn-export jpg" onclick="executeDownload('jpg')">📸 JPG (เฉพาะหน้านี้)</button>
            <button class="btn-export cancel" onclick="closeExportModal()">ยกเลิก</button>
        </div>
    </div>

    <!-- Script สำหรับดึงข้อมูล Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6X-sBEO8AqZF2i0qzJqyrwLU5FVtqQ5s",
            authDomain: "ipad-drawing-app.firebaseapp.com",
            projectId: "ipad-drawing-app",
            storageBucket: "ipad-drawing-app.firebasestorage.app",
            messagingSenderId: "1039285685408",
            appId: "1:1039285685408:web:d1ae93d102084e2c3c0dc5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');

        async function init() {
            if (docId) {
                try {
                    const docRef = doc(db, "workbooks", docId);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        window.initializeWorkspace(docSnap.data().url);
                    } else {
                        alert("ไม่พบข้อมูลแบบฝึกหัดนี้"); window.location.href = 'index.html';
                    }
                } catch (e) {
                    alert("เกิดข้อผิดพลาดในการโหลดข้อมูล");
                }
            } else {
                alert("ไม่พบข้อมูลที่ต้องการ"); window.location.href = 'index.html';
            }
        }
        init();
    </script>

    <!-- Script ควบคุมระบบวาดเขียน -->
    <script>
        let isSafeToLeave = false; 
        window.addEventListener('beforeunload', function (e) { if (!isSafeToLeave) { e.preventDefault(); e.returnValue = ''; } });
        window.history.pushState(null, null, window.location.href);
        window.addEventListener('popstate', function (event) {
            if (!isSafeToLeave) {
                if(confirm('คุณต้องการออกจากหน้านี้ใช่ไหม?\n(ข้อมูลลายมือที่ยังไม่ได้กดเซฟจะหายไปนะ)')) {
                    isSafeToLeave = true; window.history.back(); 
                } else { window.history.pushState(null, null, window.location.href); }
            }
        });

        function goBack() { window.location.href = 'index.html'; }

        const workspace = document.getElementById('workspace');
        const drawingTools = document.getElementById('drawingTools');
        
        let isDarkMode = false;
        let currentTool = 'pen'; 
        let currentColor = '#000000';
        let currentSize = 5;
        let currentOpacity = 1.0;
        
        let globalUndoStack = []; 
        let globalRedoStack = []; 
        
        let allPageUrls = [];
        let currentPageIndex = 0;

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-theme', isDarkMode);
            document.getElementById('btnTheme').innerHTML = isDarkMode ? '☀️' : '🌙'; 
        }

        function setTool(tool, btnElement) {
            currentTool = tool;
            const btns = drawingTools.querySelectorAll('.tool-btn');
            btns.forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            else document.getElementById(tool === 'highlighter' ? 'btnHighlighter' : 'btnPen').classList.add('active');
        }

        function undo() {
            if (globalUndoStack.length === 0) return;
            const lastState = globalUndoStack.pop();
            const targetCanvas = document.getElementById(`canvas-page-${lastState.index}`);
            if (targetCanvas) {
                const ctx = targetCanvas.getContext('2d');
                globalRedoStack.push({ index: lastState.index, imageData: ctx.getImageData(0, 0, targetCanvas.width, targetCanvas.height) });
                ctx.putImageData(lastState.imageData, 0, 0);
                saveCurrentCanvas();
            }
        }

        function redo() {
            if (globalRedoStack.length === 0) return;
            const nextState = globalRedoStack.pop();
            const targetCanvas = document.getElementById(`canvas-page-${nextState.index}`);
            if (targetCanvas) {
                const ctx = targetCanvas.getContext('2d');
                globalUndoStack.push({ index: nextState.index, imageData: ctx.getImageData(0, 0, targetCanvas.width, targetCanvas.height) });
                ctx.putImageData(nextState.imageData, 0, 0);
                saveCurrentCanvas();
            }
        }

        window.initializeWorkspace = function(imageUrls) {
            allPageUrls = imageUrls.split('|').map(url => url.trim());
            currentPageIndex = 0;
            document.getElementById('paginationBar').style.display = allPageUrls.length > 1 ? 'flex' : 'none';
            renderCurrentPage();
        };

        function renderCurrentPage() {
            workspace.innerHTML = ''; 
            globalUndoStack = []; globalRedoStack = [];
            createCanvasPage(allPageUrls[currentPageIndex], currentPageIndex);
            
            document.getElementById('pageIndicator').innerText = `${currentPageIndex + 1} / ${allPageUrls.length}`;
            document.getElementById('btnPrevPage').disabled = currentPageIndex === 0;
            document.getElementById('btnNextPage').disabled = currentPageIndex === allPageUrls.length - 1;
        }

        window.prevPage = function() {
            if(currentPageIndex > 0) {
                saveCurrentCanvas(); currentPageIndex--; renderCurrentPage();
            }
        };

        window.nextPage = function() {
            if(currentPageIndex < allPageUrls.length - 1) {
                saveCurrentCanvas(); currentPageIndex++; renderCurrentPage();
            }
        };

        function saveCurrentCanvas() {
            const canvas = document.getElementById(`canvas-page-${currentPageIndex}`);
            if(canvas) {
                const storageKey = canvas.getAttribute('data-storage-key');
                try { localStorage.setItem(storageKey, canvas.toDataURL('image/png')); } catch(e) {}
            }
        }

        function createCanvasPage(url, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'canvas-wrapper';
            
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.className = "bg-img";
            img.src = url;
            
            const canvas = document.createElement('canvas');
            canvas.id = `canvas-page-${index}`;
            canvas.className = "main-canvas";
            
            const storageKey = "draft_" + index + "_" + encodeURIComponent(url).slice(-40);
            canvas.setAttribute('data-storage-key', storageKey);
            
            const draftCanvas = document.createElement('canvas');
            draftCanvas.id = `draft-canvas-${index}`;
            draftCanvas.className = "draft-canvas";
            
            img.onload = () => {
                canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                draftCanvas.width = img.naturalWidth; draftCanvas.height = img.naturalHeight;
                
                const savedDraft = localStorage.getItem(storageKey);
                if (savedDraft) {
                    const draftImg = new Image();
                    draftImg.onload = () => {
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(draftImg, 0, 0);
                        globalUndoStack.push({ index: index, imageData: ctx.getImageData(0, 0, canvas.width, canvas.height) });
                    };
                    draftImg.src = savedDraft;
                } else {
                    globalUndoStack.push({ index: index, imageData: canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height) });
                }
            };

            wrapper.appendChild(img); wrapper.appendChild(canvas); wrapper.appendChild(draftCanvas);
            workspace.appendChild(wrapper);

            setupDrawingSystem(canvas, draftCanvas, index, storageKey);
        }

        function setupDrawingSystem(canvas, draftCanvas, pageIndex, storageKey) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true }); 
            const draftCtx = draftCanvas.getContext('2d', { willReadFrequently: true }); 
            let isDrawing = false; let lastX = 0, lastY = 0;

            function getPos(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            }

            function startAction(x, y) {
                globalUndoStack.push({ index: pageIndex, imageData: ctx.getImageData(0, 0, canvas.width, canvas.height) });
                if (globalUndoStack.length > 50) globalUndoStack.shift();
                globalRedoStack = [];

                isDrawing = true; lastX = x; lastY = y;
                if (currentTool === 'highlighter') { draftCanvas.style.opacity = currentOpacity * 0.3; } 
                else if (currentTool === 'pen') { draftCanvas.style.opacity = currentOpacity; }
            }

            function drawAction(x, y, pressure) {
                if (!isDrawing) return;
                
                if (currentTool === 'eraser') {
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.globalAlpha = 1.0; ctx.lineWidth = currentSize * 5; ctx.strokeStyle = "rgba(0,0,0,1)";
                    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
                } else {
                    draftCtx.lineCap = 'round'; draftCtx.lineJoin = 'round';
                    draftCtx.globalCompositeOperation = 'source-over';
                    draftCtx.globalAlpha = 1.0; 
                    if (currentTool === 'highlighter') {
                        draftCtx.lineWidth = currentSize * 4; draftCtx.strokeStyle = currentColor;
                    } else {
                        draftCtx.lineWidth = (pressure * currentSize * 2) + 1; draftCtx.strokeStyle = currentColor;
                    }
                    draftCtx.beginPath(); draftCtx.moveTo(lastX, lastY); draftCtx.lineTo(x, y); draftCtx.stroke();
                }
                lastX = x; lastY = y;
            }

            function stopAction() {
                if (isDrawing) {
                    if (currentTool !== 'eraser') {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.globalAlpha = currentTool === 'highlighter' ? currentOpacity * 0.3 : currentOpacity;
                        ctx.drawImage(draftCanvas, 0, 0);
                        draftCtx.clearRect(0, 0, draftCanvas.width, draftCanvas.height);
                    }
                    isDrawing = false; saveCurrentCanvas();
                }
            }

            canvas.addEventListener('mousedown', (e) => { const pos = getPos(e.clientX, e.clientY); startAction(pos.x, pos.y); });
            canvas.addEventListener('mousemove', (e) => { const pos = getPos(e.clientX, e.clientY); drawAction(pos.x, pos.y, 0.5); });
            canvas.addEventListener('mouseup', stopAction); canvas.addEventListener('mouseleave', stopAction);

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches[0].touchType === 'stylus') {
                    e.preventDefault(); const pos = getPos(e.touches[0].clientX, e.touches[0].clientY); startAction(pos.x, pos.y);
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches[0].touchType === 'stylus') {
                    e.preventDefault(); const pos = getPos(e.touches[0].clientX, e.touches[0].clientY);
                    let pressure = e.touches[0].force !== undefined ? e.touches[0].force : 0.5;
                    if (pressure === 0) pressure = 0.5; drawAction(pos.x, pos.y, pressure);
                }
            }, { passive: false });

            canvas.addEventListener('touchend', stopAction); canvas.addEventListener('touchcancel', stopAction);
        }

        function clearDraft() {
            if(confirm('ต้องการลบลายมือหน้านี้ เพื่อเริ่มทำใหม่ใช่หรือไม่?')) {
                const canvas = document.getElementById(`canvas-page-${currentPageIndex}`);
                if(canvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height); 
                    localStorage.removeItem(canvas.getAttribute('data-storage-key')); 
                    globalUndoStack = [{ index: currentPageIndex, imageData: ctx.getImageData(0,0,canvas.width,canvas.height) }];
                    globalRedoStack = [];
                }
            }
        }

        const modal = document.getElementById('exportModal');
        function openExportModal() { modal.style.display = 'flex'; }
        function closeExportModal() { modal.style.display = 'none'; }

        function loadImage(src) {
            return new Promise((resolve) => {
                const img = new Image(); img.crossOrigin = "anonymous";
                img.onload = () => resolve(img); img.src = src;
            });
        }

        async function executeDownload(format) {
            closeExportModal(); isSafeToLeave = true; 
            const btnSave = document.querySelector('.btn-primary');
            const originalText = btnSave.innerHTML;
            
            saveCurrentCanvas(); 

            if (format === 'pdf') {
                const { jsPDF } = window.jspdf;
                let pdf;
                
                for (let i = 0; i < allPageUrls.length; i++) {
                    btnSave.innerHTML = `⏳ สร้าง PDF (${i + 1}/${allPageUrls.length})...`;
                    const imgUrl = allPageUrls[i];
                    const storageKey = "draft_" + i + "_" + encodeURIComponent(imgUrl).slice(-40);
                    const savedDraft = localStorage.getItem(storageKey);

                    const bgImg = await loadImage(imgUrl);
                    const exportCanvas = document.createElement('canvas');
                    exportCanvas.width = bgImg.naturalWidth; exportCanvas.height = bgImg.naturalHeight;
                    const ctx = exportCanvas.getContext('2d');

                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
                    ctx.drawImage(bgImg, 0, 0);

                    if (savedDraft) {
                        const draftImg = await loadImage(savedDraft);
                        ctx.drawImage(draftImg, 0, 0);
                    }

                    const imgData = exportCanvas.toDataURL('image/jpeg', 0.8);
                    const orientation = exportCanvas.width > exportCanvas.height ? 'l' : 'p';
                    
                    if (i === 0) pdf = new jsPDF({ orientation: orientation, unit: 'px', format: [exportCanvas.width, exportCanvas.height] });
                    else pdf.addPage([exportCanvas.width, exportCanvas.height], orientation);
                    
                    pdf.addImage(imgData, 'JPEG', 0, 0, exportCanvas.width, exportCanvas.height);
                }
                btnSave.innerHTML = "⏳ กำลังดาวน์โหลด...";
                pdf.save('แบบฝึกหัด-ส่งงาน.pdf'); 
            } 
            else {
                btnSave.innerHTML = "⏳ กำลังเซฟรูป...";
                const imgUrl = allPageUrls[currentPageIndex];
                const storageKey = "draft_" + currentPageIndex + "_" + encodeURIComponent(imgUrl).slice(-40);
                const savedDraft = localStorage.getItem(storageKey);

                const bgImg = await loadImage(imgUrl);
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = bgImg.naturalWidth; exportCanvas.height = bgImg.naturalHeight;
                const ctx = exportCanvas.getContext('2d');

                if (format === 'jpg') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height); }
                ctx.drawImage(bgImg, 0, 0);
                if (savedDraft) { const draftImg = await loadImage(savedDraft); ctx.drawImage(draftImg, 0, 0); }

                const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
                const link = document.createElement('a');
                link.download = `แบบฝึกหัด-หน้า${currentPageIndex + 1}.${format}`;
                link.href = exportCanvas.toDataURL(mimeType, 0.9); link.click();
            }
            
            btnSave.innerHTML = originalText;
            isSafeToLeave = false;
        }
    </script>
</body>
</html>
