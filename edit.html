<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พื้นที่ทำแบบฝึกหัด (เรียงต่อกันหลายหน้า)</title>
    <style>
        body { font-family: sans-serif; background-color: #e9ecef; text-align: center; margin: 0; padding: 15px; }
        .header-tools { 
            position: sticky; top: 0; z-index: 100;
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
        }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; color: white; font-weight: bold; transition: 0.2s;}
        button:active { transform: scale(0.95); }
        .btn-back { background: #555; }
        .btn-save { background: #34C759; }
        #btnToggleMode { background: #007AFF; font-size: 18px; padding: 10px 30px;}
        #workspace { width: 100%; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }
        .canvas-wrapper { position: relative; background: white; box-shadow: 0 5px 20px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; }
        canvas { max-width: 100%; height: auto; display: block; }
        .mode-draw canvas { touch-action: none; cursor: crosshair; }
        .mode-scroll canvas { touch-action: auto; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header-tools">
        <button class="btn-back" onclick="window.location.href='index.html'">⬅️ กลับ</button>
        <button id="btnToggleMode" onclick="toggleMode()">✍️ โหมดวาดเขียน</button>
        <button class="btn-save" onclick="downloadAll()">💾 เซฟทั้งหมดลงเครื่อง</button>
    </div>

    <div id="workspace" class="mode-draw"></div>

    <script>
        const workspace = document.getElementById('workspace');
        let currentMode = 'draw';
        let originalImages = []; 

        function toggleMode() {
            const btn = document.getElementById('btnToggleMode');
            if (currentMode === 'draw') {
                currentMode = 'scroll';
                workspace.className = 'mode-scroll'; 
                btn.innerHTML = '👆 โหมดเลื่อนหน้าจอ';
                btn.style.background = '#FF9500'; 
            } else {
                currentMode = 'draw';
                workspace.className = 'mode-draw';
                btn.innerHTML = '✍️ โหมดวาดเขียน';
                btn.style.background = '#007AFF'; 
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const imageUrlFromUrl = urlParams.get('img');

        if (imageUrlFromUrl) {
            const pages = imageUrlFromUrl.split('|').map(url => url.trim());
            pages.forEach((url, index) => {
                createCanvasPage(url, index);
            });
        } else {
            alert("ไม่พบข้อมูลรูปภาพ กรุณาเลือกรูปใหม่");
            window.location.href = 'index.html';
        }

        function createCanvasPage(url, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'canvas-wrapper';
            const canvas = document.createElement('canvas');
            canvas.id = `canvas-page-${index}`;
            wrapper.appendChild(canvas);
            workspace.appendChild(wrapper);
            setupDrawingSystem(canvas, url, index);
        }

        function setupDrawingSystem(canvas, url, index) {
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            let lastX = 0, lastY = 0;

            const img = new Image();
            img.crossOrigin = "anonymous"; 
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                originalImages[index] = img;
            };
            img.src = url;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }

            canvas.addEventListener('pointerdown', (e) => {
                isDrawing = true;
                const pos = getPos(e);
                lastX = pos.x;
                lastY = pos.y;
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDrawing) return;
                const pos = getPos(e);
                let pressure = e.pressure !== undefined ? e.pressure : 0.5;
                
                ctx.lineWidth = (pressure * 12) + 2; 
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = '#000000'; 

                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();

                lastX = pos.x;
                lastY = pos.y;
            });

            canvas.addEventListener('pointerup', () => isDrawing = false);
            canvas.addEventListener('pointercancel', () => isDrawing = false);
        }

        function downloadAll() {
            const canvases = document.querySelectorAll('canvas');
            if (canvases.length === 0) return;

            canvases.forEach((canvas, index) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.download = `แบบฝึกหัด-หน้า-${index + 1}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }, index * 300); 
            });
        }
    </script>
</body>
</html>
