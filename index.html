<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Drawing from Sheets</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; margin: 0; padding: 20px; }
        
        .gallery { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .gallery img { 
            width: 150px; height: auto; object-fit: cover; 
            cursor: pointer; border: 3px solid #ddd; border-radius: 8px; transition: 0.2s;
        }
        .gallery img:hover { border-color: #007AFF; transform: scale(1.05); }

        .tools { margin-bottom: 15px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; margin: 0 5px; color: white;}
        .btn-clear { background: #FF3B30; }
        .btn-save { background: #007AFF; }

        /* การตั้งค่า Canvas สำหรับ iPad */
        #workspace { width: 100%; max-width: 800px; margin: 0 auto; overflow: hidden; }
        canvas {
            background-color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 8px;
            max-width: 100%; height: auto;
            touch-action: none; /* ป้องกันจอมือถือ/iPad เลื่อนตอนวาด */
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <h2>🖼️ เลือกแบบฝึกหัด</h2>
    <!-- แกลเลอรี่รูปจะถูกสร้างอัตโนมัติจาก Google Sheets ตรงนี้ -->
    <div class="gallery" id="gallery"></div>

    <h2>✍️ พื้นที่ทำงาน</h2>
    <div class="tools">
        <button class="btn-clear" onclick="clearCanvas()">ล้างเส้นทั้งหมด</button>
        <button class="btn-save" onclick="downloadImage()">💾 บันทึกรูปภาพ</button>
    </div>

    <div id="workspace">
        <canvas id="drawingCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const galleryDiv = document.getElementById('gallery');
        
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let currentImage = null;

        // ==========================================
        // 1. ดึงข้อมูลจาก Google Sheets (CSV)
        // ==========================================
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQqqPUoTOiLWK3K7td1PSnk3qxRJL3HziMYQGZAVMPi4QYZ1PLWQyiEP_e4ihJ5KCysHEMkJL6gV5MZ/pub?gid=0&single=true&output=csv'; // <--- เปลี่ยนตรงนี้!!!

        async function fetchImagesFromSheets() {
            try {
                const response = await fetch(sheetCsvUrl);
                const text = await response.text();
                
                // แยกแถว (บรรทัด) และตัดบรรทัดแรก (หัวข้อ) ทิ้ง
                const rows = text.split('\n').slice(1); 
                
                rows.forEach(row => {
                    const columns = row.split(','); // แยกคอลัมน์ด้วยจุลภาค
                    if(columns.length >= 2) {
                        const name = columns[0].trim();
                        const url = columns[1].trim();

                        if(url) {
                            // สร้างแท็ก <img> เพื่อโชว์ในแกลเลอรี่
                            const imgElement = document.createElement('img');
                            imgElement.src = url;
                            imgElement.alt = name;
                            imgElement.title = name;
                            imgElement.onclick = () => loadImageToCanvas(url);
                            galleryDiv.appendChild(imgElement);
                        }
                    }
                });
            } catch (error) {
                console.error("ดึงข้อมูลจาก Sheets ไม่สำเร็จ:", error);
                galleryDiv.innerHTML = "<p>ไม่สามารถโหลดรูปภาพได้</p>";
            }
        }

        // ==========================================
        // 2. โหลดรูปลง Canvas
        // ==========================================
        function loadImageToCanvas(url) {
            const img = new Image();
            img.crossOrigin = "anonymous"; // สำคัญมาก! ป้องกัน Error ตอนกดบันทึกรูปลงเครื่อง
            img.onload = () => {
                // ตั้งขนาด Canvas ให้เท่ากับรูปจริง
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                currentImage = img;
            };
            img.src = url;
        }

        // ==========================================
        // 3. ระบบวาดเขียน (รองรับ Apple Pencil)
        // ==========================================
        
        // ฟังก์ชันช่วยหาพิกัดที่แท้จริงบน Canvas (เพราะหน้าจออาจจะย่อ/ขยายรูป)
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            const pos = getPos(e);

            // เช็คน้ำหนักการกด (Pressure) จาก Apple Pencil
            let pressure = e.pressure !== undefined ? e.pressure : 0.5;
            
            ctx.lineWidth = (pressure * 12) + 2; // ปรับความหนาเส้น
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#000000'; // สีปากกา (สีดำ)

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        });

        canvas.addEventListener('pointerup', () => isDrawing = false);
        canvas.addEventListener('pointercancel', () => isDrawing = false);

        // ==========================================
        // 4. ปุ่มเครื่องมือ
        // ==========================================
        function clearCanvas() {
            if (currentImage) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(currentImage, 0, 0);
            }
        }

        function downloadImage() {
            if(!currentImage) {
                alert("กรุณาเลือกรูปและวาดก่อนบันทึก!");
                return;
            }
            const link = document.createElement('a');
            link.download = 'my-drawing.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // เริ่มต้นการทำงาน: สั่งให้ดึงข้อมูลจาก Sheets ทันทีที่เปิดเว็บ
        fetchImagesFromSheets();
    </script>
</body>
</html>
