<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกแบบฝึกหัด</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; margin: 0; padding: 20px; }
        
        /* ช่องค้นหา */
        .search-box { margin-bottom: 20px; }
        .search-box input { 
            padding: 12px; width: 80%; max-width: 400px; 
            font-size: 16px; border: 2px solid #ccc; border-radius: 8px; 
        }

        /* แกลเลอรี่ */
        .gallery { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; }
        .gallery-item { text-align: center; }
        .gallery-item img { 
            width: 150px; height: 150px; object-fit: cover; 
            cursor: pointer; border: 3px solid #ddd; border-radius: 8px; transition: 0.2s;
        }
        .gallery-item img:hover { border-color: #007AFF; transform: scale(1.05); }
        .gallery-item p { margin-top: 5px; font-size: 14px; color: #333; }
    </style>
</head>
<body>

    <h2>🔍 ค้นหาและเลือกแบบฝึกหัด</h2>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="พิมพ์ชื่อแบบฝึกหัดเพื่อค้นหา..." onkeyup="filterImages()">
    </div>

    <div class="gallery" id="gallery"></div>

    <script>
        const galleryDiv = document.getElementById('gallery');
        let allImages = []; // ตัวแปรสำหรับเก็บข้อมูลรูปทั้งหมดไว้ทำระบบค้นหา

        // ==========================================
        // 🚨 ใส่ลิงก์ CSV จาก Google Sheets ตรงนี้ 🚨
        // ==========================================
        const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQqqPUoTOiLWK3K7td1PSnk3qxRJL3HziMYQGZAVMPi4QYZ1PLWQyiEP_e4ihJ5KCysHEMkJL6gV5MZ/pub?gid=0&single=true&output=csv'; 

        async function fetchImagesFromSheets() {
            try {
                const response = await fetch(sheetCsvUrl);
                const text = await response.text();
                const rows = text.split('\n').slice(1); 
                
                rows.forEach(row => {
                    const columns = row.split(','); 
                    if(columns.length >= 2) {
                        const name = columns[0].trim();
                        const url = columns[1].trim();
                        if(url) {
                            allImages.push({ name, url }); // เก็บลง Array
                        }
                    }
                });
                renderGallery(allImages); // นำไปแสดงผล
            } catch (error) {
                galleryDiv.innerHTML = "<p>ไม่สามารถโหลดรูปภาพได้</p>";
            }
        }

        // ฟังก์ชันสร้างแกลเลอรี่
        function renderGallery(imagesToRender) {
            galleryDiv.innerHTML = ''; // ล้างของเก่าก่อน
            if(imagesToRender.length === 0) {
                galleryDiv.innerHTML = "<p>ไม่พบรูปภาพที่ค้นหา</p>";
                return;
            }

            imagesToRender.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                
                const img = document.createElement('img');
                img.src = item.url;
                img.alt = item.name;
                // ✨ เมื่อกดที่รูป ให้เปลี่ยนหน้าไปที่ edit.html พร้อมแนบ URL รูปไปด้วย ✨
                img.onclick = () => {
                    window.location.href = `edit.html?img=${encodeURIComponent(item.url)}`;
                };

                const p = document.createElement('p');
                p.textContent = item.name;

                div.appendChild(img);
                div.appendChild(p);
                galleryDiv.appendChild(div);
            });
        }

        // ฟังก์ชันค้นหารูปภาพ
        function filterImages() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allImages.filter(item => item.name.toLowerCase().includes(searchText));
            renderGallery(filtered);
        }

        // เริ่มโหลดข้อมูล
        fetchImagesFromSheets();
    </script>
</body>
</html>
