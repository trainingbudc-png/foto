<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกแบบฝึกหัด</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; margin: 0; padding: 20px; position: relative; }
        
        /* สไตล์ปุ่มแอดมิน มุมขวาบน */
        .btn-admin {
            position: absolute; 
            top: 15px; 
            right: 15px;
            background-color: #333; 
            color: white; 
            border: none;
            padding: 10px 15px; 
            border-radius: 8px; 
            font-size: 14px;
            font-weight: bold; 
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .btn-admin:hover { background-color: #000; transform: scale(1.05); }

        .search-box { margin-bottom: 20px; margin-top: 40px; }
        .search-box input { 
            padding: 12px; width: 80%; max-width: 400px; 
            font-size: 16px; border: 2px solid #ccc; border-radius: 8px; 
        }
        
        .gallery { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }
        .gallery-item { 
            text-align: center; background: white; padding: 15px; 
            border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .gallery-item img { 
            width: 150px; height: 150px; object-fit: cover; 
            cursor: pointer; border: 3px solid #ddd; border-radius: 8px; transition: 0.2s;
        }
        .gallery-item img:hover { border-color: #007AFF; transform: scale(1.05); }
        .gallery-item p { margin-top: 10px; font-size: 15px; color: #333; font-weight: bold; margin-bottom: 0;}
        .loader { color: #888; font-size: 18px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ✨ ปุ่มแอดมิน มุมขวาบน ✨ -->
    <button class="btn-admin" onclick="checkAdmin()">🔒 จัดการแบบฝึกหัด</button>

    <h2>🔍 ค้นหาและเลือกแบบฝึกหัด</h2>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="พิมพ์ชื่อแบบฝึกหัดเพื่อค้นหา...">
    </div>

    <div class="gallery" id="gallery">
        <div class="loader" id="loader">⏳ กำลังโหลดข้อมูลแบบฝึกหัด...</div>
    </div>

    <!-- ========================================== -->
    <!-- 🔑 สคริปต์ตรวจรหัสผ่าน -->
    <!-- ========================================== -->
    <script>
        function checkAdmin() {
            const pass = prompt("กรุณาใส่รหัสผ่านสำหรับคุณครู:");
            
            // 💡 เปลี่ยนรหัสผ่านตรงตัวเลข "1234" ในบรรทัดข้างล่างนี้ได้เลยครับ!
            if (pass === "1234") { 
                window.location.href = "admin.html";
            } else if (pass !== null && pass !== "") {
                alert("❌ รหัสผ่านไม่ถูกต้อง!");
            }
        }
    </script>

    <!-- ========================================== -->
    <!-- 🔥 เรียกใช้ Firebase (ดึงรูปมาโชว์) -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6X-sBEO8AqZF2i0qzJqyrwLU5FVtqQ5s",
            authDomain: "ipad-drawing-app.firebaseapp.com",
            projectId: "ipad-drawing-app",
            storageBucket: "ipad-drawing-app.firebasestorage.app",
            messagingSenderId: "1039285685408",
            appId: "1:1039285685408:web:d1ae93d102084e2c3c0dc5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const galleryDiv = document.getElementById('gallery');
        const loader = document.getElementById('loader');
        let allImages = [];

        async function fetchImagesFromFirestore() {
            try {
                const q = query(collection(db, "workbooks"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.url && data.name) {
                        allImages.push({ name: data.name, url: data.url });
                    }
                });

                loader.style.display = 'none';
                renderGallery(allImages);

            } catch (error) {
                console.error("Error fetching documents: ", error);
                galleryDiv.innerHTML = "<p>❌ ไม่สามารถโหลดรูปภาพได้ กรุณาลองใหม่</p>";
            }
        }

        function renderGallery(imagesToRender) {
            galleryDiv.innerHTML = ''; 
            if(imagesToRender.length === 0) {
                galleryDiv.innerHTML = "<p>ไม่พบรูปภาพในระบบ</p>";
                return;
            }

            imagesToRender.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                
                const img = document.createElement('img');
                img.src = item.url;
                img.alt = item.name;
                img.onclick = () => {
                    window.location.href = `edit.html?img=${encodeURIComponent(item.url)}`;
                };

                const p = document.createElement('p');
                p.textContent = item.name;

                div.appendChild(img);
                div.appendChild(p);
                galleryDiv.appendChild(div);
            });
        }

        // ระบบค้นหา
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const searchText = e.target.value.toLowerCase();
            const filtered = allImages.filter(item => item.name.toLowerCase().includes(searchText));
            renderGallery(filtered);
        });

        // เริ่มโหลดข้อมูล
        fetchImagesFromFirestore();
    </script>
</body>
</html>
